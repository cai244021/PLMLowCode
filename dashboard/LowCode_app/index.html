<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>PLM Low-Code Widget</title>
		<script type="text/javascript">
			(function () {
				var basePath = './';
				try {
					basePath = widget.uwaUrl.substring(0, widget.uwaUrl.lastIndexOf('/') + 1);
				} catch (ignore) {}
				fetch(basePath + 'static/version.json?ts=' + Date.now())
					.then(function (response) { return response.json(); })
					.then(function (version) {
						var style = document.createElement('link');
						style.rel = 'stylesheet';
						style.href = basePath + 'assets/styles/bundle.css?v=' + version.stable;
						document.head.appendChild(style);
						var script = document.createElement('script');
						script.src = basePath + 'bundle.js?v=' + version.stable;
						document.head.appendChild(script);
					})
					.catch(function (error) {
						document.body.textContent = 'Widget资源加载失败：' + error.message;
					});
			}());
		</script>
	</head>
	<body>
		<app id="app"></app>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
