<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset='utf-8'>
    <title> ECR零件导入结果通知</title>
    <style>
        table {
            width: 70%;
            border-collapse: collapse;
        }
        th, td {
            border: 2px solid black;
            padding: 5px;
            text-align: center;
        }
        th {
            background-color: white;
            color: black;
        }
        .context,.context1 {
            margin-top: -15px; /* 这里将上下左右的外边距都设置为10px，你可以根据需要调整数值 */
            margin-left: 30px;
        }
        .context1 {
            margin-bottom: 20px;
        }
    </style>

</head>
<body>
<h4>尊敬的用户： 您好</h4>
<div id="form" style="border: black 0px solid;">
    <div class="context" id="name" style=" display: flex;height: 50px;align-items: flex-start;">
        <label style="text-align: left;"><b>ECR: </b></label>
        <label id="ECRName" style="text-align: left;color:red;font-weight:bolder"></label>
			<div>
		<label >&nbsp;&nbsp;导入零件已经生成受影响结构！</label>
		</div>
    </div>

	<div class="context" id="Success" style=" display: flex;height: 50px;align-items: flex-start;">
        <label style="text-align: left;">成功导入的零件:</label>
    </div>
    <div class="context" id="Failed" style="text-align: left;display: flex;height: 50px;align-items: flex-start;">
        <label id="Error" style="text-align: left;">校验未通过的零件:</label>
        <div>
            <label >&nbsp;&nbsp;校验异常信息已写入附件的Excel文件中,请下载查看！</label>
        </div>
    </div>
    <div class="context" id="linkText" style=" display: flex;height: 50px;align-items: flex-start;">
        <label style="text-align: left;">查看详情,请点击下面的链接: &nbsp;&nbsp;&nbsp;</label>
    </div>
    <div class="context" id="linkAddress" style=" display: flex;height: 50px;align-items: flex-start;">
            <a  id="Address" href="" target="_blank" style="text-align: left;"></a>
    </div>
    <div class="mess" id="mess" style=" display: flex;height: 50px;align-items: flex-start;">
        <label style="text-align: left;color: red">
            注: </br>
            1、此邮件由系统自动生成,无需进行回复</br>
            2、针对数据本身的问题,请与我单位发起该ECR的工程师联系</br>
        </label>
    </div>
</div>

</body>
</html>
