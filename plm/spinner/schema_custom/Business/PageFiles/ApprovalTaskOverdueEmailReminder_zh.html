<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>审批任务超期提醒</title>
    <style>
        body {
            color: #111;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            margin: 8px 0 18px;
            text-align: center;
        }

        p {
            margin: 4px 0;
        }

        table {
            border-collapse: collapse;
            margin-top: 16px;
            max-width: 100%;
            width: 980px;
        }

        th,
        td {
            border: 1px solid #000;
            padding: 5px 8px;
            text-align: center;
            word-break: break-all;
        }

        th {
            font-weight: 600;
        }

        a {
            color: #0645ad;
        }

        .footer {
            color: red;
            margin-top: 26px;
        }
    </style>
</head>
<body>
<h2>审批任务超期提醒</h2>
<p>尊敬的<span id="userName"></span>：您好</p>
<p>截至<span id="reportDate"></span>，以下审批任务已超过规定的工作日未处理，请尽快完成审批：</p>
<table>
    <thead>
    <tr>
        <th>序号</th>
        <th>审批对象编号</th>
        <th>审批对象名称</th>
        <th>审批节点</th>
        <th>任务分配时间</th>
        <th>已等待工作日</th>
        <th>链接地址</th>
    </tr>
    </thead>
    <tbody id="reminderBody"></tbody>
</table>
<div class="footer">
    <p>注：</p>
    <p>1、此邮件由系统自动生成，无需进行回复。</p>
    <p>2、请及时进入 PLM 系统处理以上审批任务。</p>
</div>
</body>
</html>
