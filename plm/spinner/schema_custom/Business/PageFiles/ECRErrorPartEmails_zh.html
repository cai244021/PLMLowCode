<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset='utf-8'>
    <title> PartList同步状态通知 </title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 2px solid black;
            padding: 5px;
            text-align: center;
        }
        th {
            background-color: white;
            color: black;
        }
        .context,.context1 {
            margin-top: -15px; /* 这里将上下左右的外边距都设置为10px，你可以根据需要调整数值 */
            margin-left: 30px;
        }
        .context1 {
            margin-bottom: 20px;
        }
    </style>

</head>
<body>
<h4>尊敬的用户： 您好</h4>
<div id="form" style="border: black 0px solid;">

    <div class="context" id="AllErrorPartList" style="display: block;">
        <div class="context" id="allDetails" style="height: 120px;align-items: flex-start;">
            <label id="projectTask" style="text-align: left;color:red;font-weight:bolder"></label>
            <label style="text-align: left;">中以下零件不是最新发布版本，已自动撤回ECR，请根据以下表格内容更新受影响父级结构，重新提交ECR审核</label>

            <br>
            <label style="text-align: left;">The system automatically rejected it because it contained an old release version.</label>
        </div>
        <div class="context" id="AllPartList" style="display: block;">
            <table>
                <table id="AllPartListTable">
                    <thead>
                    <tr>

                        <th>当前ECR零件号
                            <br>
                            Current Part Number
                        </th>

                        <th>当前ECR零件修订版
                            <br>
                            Current Part Revision
                        </th>

                        <th>零件最新版
                            <br>
                            Part Latest Revision
                        </th>

                        <th>零件最新发布ECR
                            <br>
                            Latest Rev ECR Name
                        </th>

                        <th>受影响父级零件号
                            <br>
                            Affected Parent Part Number
                        </th>

                    </tr>
                    </thead>
                    <tbody id="AllPartListTbody">

                    </tbody>
                </table>
            </table>
        </div>
    </div>

<!-- 链接地址只有  单个PartList含有   -->
    <div class="context" id="LinkText" style="display: none;">
        <br>
        <div class="context" id="" style="height: 50px;align-items: flex-start;">
            <label style="text-align: left;">请点击下面的链接查看数据详情: &nbsp;&nbsp;&nbsp;</label>
            <br>
            <label style="text-align: left;">Please click on the link below to view the data details: &nbsp;&nbsp;&nbsp;</label>
        </div>
        <div class="context" id="linkAddress" style="height: 50px;align-items: flex-start;">
            <a  id="Address" href="" target="_blank" style="text-align: left;"></a>
        </div>
    </div>

<!-- 备注均有   -->
    <div class="mess" id="mess" style=" display: block;height: 50px;align-items: flex-start;color: red">
        <label style="text-align: left;color: red">
            注: </br>
            1、此邮件由系统自动生成,无需进行回复</br>
            2、针对数据本身的问题,请与我单位发起该数据的工程师联系</br>
        </label>
    </div>
</div>

</body>
</html>
