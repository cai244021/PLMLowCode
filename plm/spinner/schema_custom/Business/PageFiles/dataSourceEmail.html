<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset='utf-8'>
    <title>
        Data transmission link and extraction code
    </title>
    <style>
        table {
            width: 70%;
            border-collapse: collapse;
        }
        th, td {
            border: 2px solid black;
            padding: 5px;
            text-align: center;
        }
        th {
            background-color: white;
            color: black;
        }
        .context,.context1 {
            margin-top: -15px; /* 这里将上下左右的外边距都设置为10px，你可以根据需要调整数值 */
            margin-left: 30px;
        }
        .context1 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<h4>Dear user: Hello</h4>
<div id="form" style="border: black 0px solid;">
    <div class="context" id="name" style=" display: flex;height: 50px;align-items: flex-start;">
        <label style="text-align: left;"><b>Distribution number:</b></label>
    </div>
    <div class="context" id="JSTopic" style=" display: flex;height: 50px;align-items: flex-start;">
        <label style="text-align: left;"><b>Distribution theme:</b></label>
    </div>
    <div class="context" id="Owner" style=" display: flex;height: 50px;align-items: flex-start;">
        <label style="text-align: left;"><b>Initiate engineer：</b></label>
    </div>
    <div class="context" id="OwnerEmail" style=" display: flex;height: 50px;align-items: flex-start;">
        <label style="text-align: left;"><b>Engineer email：</b></label>
    </div>
    <div class="context" id="description" style=" display: flex;height: 50px;align-items: flex-start;">
        <label style="text-align: left;"><b>Distribution data description:</b></label>
    </div>
    <div class="context" id="linkText" style=" display: flex;height: 50px;align-items: flex-start;">
        <label style="text-align: left;">Please click on the link below to extract the corresponding file: &nbsp;&nbsp;&nbsp;</label>
    </div>
    <div class="context" id="linkAddress" style=" display: flex;height: 50px;align-items: flex-start;">
        <label >
            <a id="Address" href="" target="_blank" style="text-align: left;"></a>
        </label>
    </div>
    <div class="context" id="password" style=" display: flex;height: 50px;align-items: flex-start;">
        <label style="text-align: left;"><b>Extract password: &nbsp;</b></label>
    </div>
    <div class="context" id="contentNotice" style=" display: flex;height: 50px;align-items: flex-start;">
        <label style="text-align: left;"><b>The list of outsourced data is as follows: </b></label>
    </div>
    <table class="context1" id="contentTable">
        <thead>
        <tr>
            <th>Name</th>
            <th>Version</th>
            <th>Type</th>
        </tr>
        </thead>
        <tbody id="content">

        </tbody>
    </table>
    <div id="mess" style=" display: flex;height: 50px;align-items: flex-start;">
        <label style="text-align: left;color: red">
            Note: </br>
            1. This email is automatically generated by the system and does not require a reply</br>
            2. Regarding the issue with the data itself, please contact the engineer from our company who sent this data</br>
        </label>
    </div>
</div>

</body>
</html>
